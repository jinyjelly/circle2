<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원주각 Quest - 재구성 버전</title>
<style>
:root{
  --bg:#f7f7f8;
  --card:#ffffff;
  --line:#d9dde3;
  --text:#1f2933;
  --muted:#69717a;
  --accent:#2563eb;
  --ok:#1f7a48;
  --okbg:#edf8f1;
  --bad:#b44141;
  --badbg:#fff1f1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:28px}
.top p{margin:6px 0 0;color:var(--muted);line-height:1.55}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.pill{padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(16,24,40,.04)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stage-list{display:grid;gap:12px}
.stage{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.stage h3{margin:0 0 6px;font-size:18px}
.stage p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.badge{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);font-weight:700}
.btn{min-height:42px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:700;color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.name-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.name-row input{width:220px;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.practice{max-width:820px;margin:0 auto}
.practice-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.left-strip{display:flex;gap:8px;flex-wrap:wrap}
.problem-card{padding:22px}
.head h2{margin:0;font-size:24px}
.head p{margin:6px 0 0;color:var(--muted)}
.progress{height:10px;background:#ebeff3;border-radius:999px;overflow:hidden;margin:12px 0 14px}
.progress>div{height:100%;background:var(--accent)}
.visual{margin:8px 0 10px;background:#fff;display:grid;place-items:center;min-height:320px}
.visual.hidden{display:none}
.visual svg{width:min(100%,460px);height:auto}
.prompt{margin:0 0 12px;color:var(--muted);font-size:15px}
.answer{display:grid;gap:12px}
.sheet{border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:18px;line-height:2;background:#fcfcfd}
.sheet select{min-height:40px;border:1px solid #cfd6dd;border-radius:8px;padding:0 10px;background:#fff;min-width:120px}
.input-row{display:flex;justify-content:center;align-items:center;gap:10px}
.input-row input{width:150px;padding:10px 12px;font-size:26px;font-weight:700;text-align:center;border:1px solid #cfd6dd;border-radius:10px}
.degree{font-size:26px;font-weight:700}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.feedback{margin-top:16px;padding:14px 16px;border-radius:12px;line-height:1.6;font-size:15px}
.feedback.good{background:var(--okbg);color:var(--ok);border:1px solid #cfead9}
.feedback.bad{background:var(--badbg);color:var(--bad);border:1px solid #f0cdcd}
.feedback.hint{background:#f7f8fa;color:#4a5560;border:1px solid var(--line)}
.hidden{display:none!important}
.complete{text-align:center;padding:28px 20px}
.complete h2{margin:0 0 10px;font-size:28px}
.complete p{margin:0;color:var(--muted);line-height:1.7}
.rewards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}
.reward{border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:120px;background:#fff}
.reward span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.reward b{font-size:20px}
.circle{fill:none;stroke:#444;stroke-width:1.8}
.line{fill:none;stroke:#666;stroke-width:1.6;stroke-linecap:round}
.angle{fill:none;stroke:#222;stroke-width:1.25;stroke-linecap:round}
.dot{fill:#111}
.label{fill:#111;font-size:17px;font-family:"Times New Roman","Noto Serif KR",serif}
.angleText{fill:#111;font-size:18px;font-family:"Times New Roman","Noto Serif KR",serif}
.xmark{fill:#111;font-size:24px;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif}
@media (max-width:720px){
  .grid2{grid-template-columns:1fr}
  .top{align-items:flex-start}
  .top h1{font-size:24px}
  .head h2{font-size:22px}
}
</style>
</head>
<body>
<div class="app">
  <section id="homeView">
    <div class="top">
      <div>
        <h1>원주각 Quest</h1>
        <p>1단계 → 2단계 → 3단계 → 4단계</p>
      </div>
      <div class="stats">
        <div class="pill">총점 <span id="sumScore">0</span></div>
        <div class="pill">XP <span id="sumXP">0</span></div>
        <div class="pill">정답 <span id="sumCorrect">0</span></div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2 style="margin:0 0 10px;font-size:20px">학생 정보</h2>
        <div class="name-row">
          <label for="nameInput" style="font-weight:700">이름</label>
          <input id="nameInput" maxlength="16" placeholder="예: 민지">
          <button class="btn" id="saveNameBtn">저장</button>
        </div>
        <p id="welcomeText" style="margin:12px 0 0;color:var(--muted)">이름을 넣으면 진행 상황이 저장됩니다.</p>
      </div>
      <div class="card">
        <h2 style="margin:0 0 10px;font-size:20px">학습 흐름</h2>
        <p id="levelInfo" style="margin:0;color:var(--muted);line-height:1.65">1단계부터 차례대로 풀어 보세요. 앞 단계를 끝내면 다음 단계가 열립니다.</p>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2 style="margin:0 0 12px;font-size:22px">학습 단계</h2>
      <div class="stage-list" id="stageList"></div>
    </div>
  </section>

  <section id="practiceView" class="hidden">
    <div class="practice">
      <div class="practice-top">
        <div class="left-strip">
          <button class="btn" id="backBtn">홈으로</button>
          <div class="pill" id="stagePill">1단계</div>
          <div class="pill" id="scorePill">점수 0</div>
          <div class="pill" id="xpPill">XP +0</div>
          <div class="pill" id="timerPill">시간 00:00</div>
        </div>
        <div class="pill" id="countPill">1 / 10</div>
      </div>

      <div class="card problem-card" id="problemCard">
        <div class="head">
          <h2 id="problemTitle">문제</h2>
          <p id="problemSub">원주각 성질</p>
        </div>
        <div class="progress"><div id="progressBar" style="width:0%"></div></div>

        <div class="visual" id="visualBox"></div>
        <p class="prompt" id="promptText"></p>
        <div class="answer" id="answerBox"></div>

        <div class="actions">
          <div><button class="btn" id="hintBtn">힌트</button></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn hidden" id="revealBtn">정답 보기</button>
            <button class="btn primary" id="checkBtn">확인</button>
            <button class="btn primary hidden" id="nextBtn">다음</button>
          </div>
        </div>

        <div id="feedbackBox" class="hidden"></div>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const STORAGE_KEY = "wonjugak_rebuild_v1";
  const STAGES = {
    stage1:{title:"1단계", desc:"성질 확인 10문제", count:10},
    stage2:{title:"2단계", desc:"문제 20개", count:20},
    stage3:{title:"3단계", desc:"문제 10개", count:10},
    stage4:{title:"4단계", desc:"문제 10개", count:10}
  };

  const defaultState = () => ({
    name:"",
    score:0,
    xp:0,
    correct:0,
    attempted:0,
    stages:{
      stage1:{unlocked:true, completed:false, bestScore:0, bestTime:null},
      stage2:{unlocked:false, completed:false, bestScore:0, bestTime:null},
      stage3:{unlocked:false, completed:false, bestScore:0, bestTime:null},
      stage4:{unlocked:false, completed:false, bestScore:0, bestTime:null}
    }
  });

  let state = loadState();
  let currentStage = null;
  let questions = [];
  let qIndex = 0;
  let stageScore = 0;
  let stageXP = 0;
  let answered = false;
  let wrongAttempts = 0;
  let stageStartTime = 0;
  let timerInterval = null;
  let lastElapsedSeconds = 0;

  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  function formatTime(totalSeconds){
    const s = Math.max(0, Math.floor(totalSeconds));
    const m = Math.floor(s/60);
    const sec = s%60;
    return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  }

  function updateTimer(){
    if(!stageStartTime) return;
    const elapsed = Math.floor((Date.now()-stageStartTime)/1000);
    lastElapsedSeconds = elapsed;
    const pill = $("#timerPill");
    if(pill) pill.textContent = `시간 ${formatTime(elapsed)}`;
  }

  function startTimer(){
    if(timerInterval) clearInterval(timerInterval);
    stageStartTime = Date.now();
    lastElapsedSeconds = 0;
    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
  }

  function stopTimer(){
    if(stageStartTime){
      lastElapsedSeconds = Math.floor((Date.now()-stageStartTime)/1000);
    }
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    stageStartTime = 0;
    return lastElapsedSeconds;
  }

  function loadState(){
    try{
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(!raw) return defaultState();
      const base = defaultState();
      return {
        ...base,
        ...raw,
        stages:{
          stage1:{...base.stages.stage1,...(raw.stages?.stage1||{})},
          stage2:{...base.stages.stage2,...(raw.stages?.stage2||{})},
          stage3:{...base.stages.stage3,...(raw.stages?.stage3||{})},
          stage4:{...base.stages.stage4,...(raw.stages?.stage4||{})}
        }
      };
    }catch(e){ return defaultState(); }
  }
  function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  function migrateUnlocks(){
    if(state.stages.stage1.completed) state.stages.stage2.unlocked = true;
    if(state.stages.stage2.completed) state.stages.stage3.unlocked = true;
    if(state.stages.stage3.completed) state.stages.stage4.unlocked = true;
    saveState();
  }

  function renderHome(){
    if(timerInterval) stopTimer();
    migrateUnlocks();
    $("#homeView").classList.remove("hidden");
    $("#practiceView").classList.add("hidden");
    $("#nameInput").value = state.name || "";
    $("#sumScore").textContent = state.score;
    $("#sumXP").textContent = state.xp;
    $("#sumCorrect").textContent = state.correct;
    $("#welcomeText").textContent = state.name ? `${state.name}의 진행 상황이 저장되어 있습니다.` : "이름을 넣으면 진행 상황이 저장됩니다.";
    if(state.stages.stage4.completed) $("#levelInfo").textContent = "모든 단계를 완료했습니다. 다시 풀며 점수를 높일 수 있습니다.";
    else if(state.stages.stage3.completed) $("#levelInfo").textContent = "4단계가 열려 있습니다.";
    else if(state.stages.stage2.completed) $("#levelInfo").textContent = "3단계가 열려 있습니다.";
    else if(state.stages.stage1.completed) $("#levelInfo").textContent = "2단계가 열려 있습니다.";
    else $("#levelInfo").textContent = "1단계부터 차례대로 풀어 보세요. 앞 단계를 끝내면 다음 단계가 열립니다.";
    renderStageList();
    saveState();
  }

  function renderStageList(){
    const order = ["stage1","stage2","stage3","stage4"];
    $("#stageList").innerHTML = order.map(key => {
      const meta = STAGES[key];
      const s = state.stages[key];
      const status = s.completed ? "완료" : s.unlocked ? "도전 가능" : "잠김";
      return `
        <div class="stage">
          <div>
            <h3>${meta.title}</h3>
            <p>${meta.desc}</p>
            <div class="badges">
              <span class="badge">${meta.count}문제</span>
              <span class="badge">${status}</span>
              ${s.bestScore ? `<span class="badge">최고 점수 ${s.bestScore}</span>` : ""}
              ${s.bestTime ? `<span class="badge">최고 기록 ${formatTime(s.bestTime)}</span>` : ""}
            </div>
          </div>
          <div>
            <button class="btn ${s.unlocked ? 'primary' : ''}" ${s.unlocked ? "" : "disabled"} data-stage="${key}">
              ${s.completed ? "다시 풀기" : "시작하기"}
            </button>
          </div>
        </div>`;
    }).join("");
    $$("[data-stage]").forEach(btn => btn.addEventListener("click", () => startStage(btn.dataset.stage)));
  }

  function startStage(stageKey){
    currentStage = stageKey;
    questions = buildQuestions(stageKey);
    qIndex = 0;
    stageScore = 0;
    stageXP = 0;
    answered = false;
    $("#homeView").classList.add("hidden");
    $("#practiceView").classList.remove("hidden");
    resetProblemCard();
    startTimer();
    renderQuestion();
  }

  function buildQuestions(stageKey){
    if(stageKey==="stage1") return buildStage1();
    if(stageKey==="stage2") return buildStage2();
    if(stageKey==="stage3") return buildStage3();
    return buildStage4();
  }

  function buildStage1(){
    return [
      fillQ("한 호에 대한 원주각의 크기는 모두 [[0]].", [["같다","절반이다","2배이다"], "같다"], "같은 호를 보는 원주각을 떠올려 보세요."),
      fillQ("같은 호에 대한 원주각의 크기는 중심각의 [[0]]이다.", [["2배","절반","세 배"], "절반"], "원주각 = 중심각 ÷ 2"),
      fillQ("같은 호에 대한 중심각의 크기는 원주각의 [[0]]이다.", [["절반","2배","같다"], "2배"], "중심각 = 원주각 × 2"),
      fillQ("반원에 대한 원주각의 크기는 [[0]]이다.", [["45°","90°","180°"], "90°"], "지름을 보는 원주각은 직각입니다."),
      fillQ("원의 [[0]]을 양 끝점으로 하는 원주각은 90°이다.", [["반지름","지름","현"], "지름"], "반원과 관련 있는 선분을 생각해 보세요."),
      fillQ("같은 호 AB에 대한 원주각 ∠ACB와 ∠ADB의 크기는 서로 [[0]].", [["같다","다르다","2배 차이"], "같다"], "같은 호를 보는 원주각은 같습니다."),
      fillQ("중심각이 120°이면, 같은 호에 대한 원주각은 [[0]]°이다.", [["60","120","240"], "60"], "120의 절반입니다."),
      fillQ("원주각이 35°이면, 같은 호에 대한 중심각은 [[0]]°이다.", [["35","70","105"], "70"], "35의 2배입니다."),
      fillQ("긴 호에 대한 원주각은 그 긴 호의 크기의 [[0]]이다.", [["절반","2배","같은 크기"], "절반"], "원주각은 바라보는 호의 크기의 절반입니다."),
      fillQ("원주각 문제를 볼 때 먼저 찾아야 하는 것은 어떤 각이 [[0]]를 바라보는지이다.", [["같은 호","같은 점","같은 반지름"], "같은 호"], "무엇을 바라보는지가 핵심입니다.")
    ];
  }

  function buildStage2(){
    return [
      numQ("기본 문제", "𝑥의 크기를 구하세요.", 55, "반원에 대한 원주각은 90°이고, 삼각형의 내각의 합은 180°입니다.", diameterTriangle(35,22), "지름과 삼각형"),
      numQ("기본 문제", "𝑥의 크기를 구하세요.", 65, "지름을 보는 각은 90°입니다.", diameterTriangle(25,345), "지름과 삼각형"),
      numQ("기본 문제", "𝑥의 크기를 구하세요.", 50, "직각삼각형의 다른 두 각의 합은 90°입니다.", diameterTriangle(40,12), "지름과 삼각형"),
      numQ("기본 문제", "𝑥의 크기를 구하세요.", 72, "90°에서 나머지 각을 이용합니다.", diameterTriangle(18,335), "지름과 삼각형"),

      numQ("기본 문제", "𝑥의 크기를 구하세요.", 40, "원주각은 중심각의 절반입니다.", centralToInscribed(80,0), "중심각 → 원주각"),
      numQ("기본 문제", "𝑥의 크기를 구하세요.", 50, "같은 호를 보는 원주각입니다.", centralToInscribed(100,345), "중심각 → 원주각"),
      numQ("기본 문제", "𝑥의 크기를 구하세요.", 60, "중심각의 절반을 구합니다.", centralToInscribed(120,15), "중심각 → 원주각"),
      numQ("기본 문제", "𝑥의 크기를 구하세요.", 70, "140°의 절반입니다.", centralToInscribed(140,0), "중심각 → 원주각"),

      numQ("기본 문제", "𝑥의 크기를 구하세요.", 32, "같은 호를 보는 원주각은 같습니다.", sameArc(32,340,20), "같은 호"),
      numQ("기본 문제", "𝑥의 크기를 구하세요.", 45, "같은 호를 보는 원주각끼리 같아요.", sameArc(45,335,25), "같은 호"),

      numQ("기본 문제", "긴 호에 대한 원주각 𝑥를 구하세요.", 130, "작은 중심각이 100°이면 긴 호의 크기는 360-100입니다.", majorArcFromMinorCenter(100), "긴 호"),
      numQ("기본 문제", "긴 호에 대한 원주각 𝑥를 구하세요.", 110, "긴 호의 크기를 먼저 생각해 보세요.", majorArcFromMinorCenter(140), "긴 호"),

      numQ("기본 문제", "𝑥의 크기를 구하세요.", 60, "중심각은 원주각의 2배입니다.", inscribedToCentral(30,0), "원주각 → 중심각"),
      numQ("기본 문제", "𝑥의 크기를 구하세요.", 84, "원주각의 2배가 중심각입니다.", inscribedToCentral(42,345), "원주각 → 중심각"),

      numQ("기본 문제", "작은 중심각 𝑥를 구하세요.", 120, "긴 호에 대한 원주각이 120°이면 긴 호의 크기는 240°입니다.", minorCenterFromMajorInscribed(120), "긴 호"),
      numQ("기본 문제", "긴 호를 보는 원주각 𝑥를 구하세요.", 125, "55°는 짧은 호를 보는 각입니다. 짧은 호의 크기와 긴 호의 크기를 구분하세요.", shortLongArcPair(55), "짧은 호 / 긴 호"),

      numQ("기본 문제", "𝑥의 크기를 구하세요.", 45, "중심 O를 기준으로 이등변삼각형을 이용합니다.", centerChord(45,45), "중심이 있는 종합"),
      numQ("기본 문제", "𝑥의 크기를 구하세요.", 55, "원의 중심에서 그은 두 반지름을 생각해 보세요.", centerChord(35,35), "중심이 있는 종합"),

  function P(x,y){return {x,y}}
  function polar(cx,cy,r,deg){
    const t=(deg-90)*Math.PI/180;
    return P(cx+r*Math.cos(t),cy+r*Math.sin(t));
  }
  function angleData(v,p1,p2,r){
    let a1=Math.atan2(p1.y-v.y,p1.x-v.x);
    let a2=Math.atan2(p2.y-v.y,p2.x-v.x);
    let d=a2-a1;
    while(d>Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;
    const ae=a1+d;
    return {
      s:P(v.x+r*Math.cos(a1),v.y+r*Math.sin(a1)),
      e:P(v.x+r*Math.cos(ae),v.y+r*Math.sin(ae)),
      mid:a1+d/2,sweep:d>=0?1:0
    };
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
  function angleArc(v,p1,p2,r,label,labelR,dx=0,dy=0){
    const a=angleData(v,p1,p2,r);
    const tx=v.x+labelR*Math.cos(a.mid)+dx;
    const ty=v.y+labelR*Math.sin(a.mid)+dy;
    const text=label==="𝑥" || label==="𝑦"
      ? `<text x="${tx.toFixed(1)}" y="${(ty+7).toFixed(1)}" class="xmark" text-anchor="middle">${label}</text>`
      : `<text x="${tx.toFixed(1)}" y="${(ty+6).toFixed(1)}" class="angleText" text-anchor="middle">${esc(label)}</text>`;
    return `<path class="angle" d="M ${a.s.x.toFixed(1)} ${a.s.y.toFixed(1)} A ${r} ${r} 0 0 ${a.sweep} ${a.e.x.toFixed(1)} ${a.e.y.toFixed(1)}"/>${text}`;
  }
  function dot(x,y){return `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"/>`}
  function oLabel(O,pos="upperRight"){
    const map={upperRight:[10,-10],upperLeft:[-24,-10],lowerRight:[10,24],lowerLeft:[-24,24],right:[12,5],left:[-24,5]};
    const [dx,dy]=map[pos];
    return `${dot(O.x,O.y)}<text class="label" x="${O.x+dx}" y="${O.y+dy}">O</text>`;
  }

    return svg(`
      <circle class="circle" cx="${O.x}" cy="${O.y}" r="${R}"/>
      <line class="line" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${A.x}" y1="${A.y}" x2="${D.x}" y2="${D.y}"/>
      <line class="line" x1="${B.x}" y1="${B.y}" x2="${D.x}" y2="${D.y}"/>
      ${angleArc(D,A,B,17,"𝑥",32,0,-1)}
      ${oLabel(O,"lowerRight")}
    `);
  }

  function finalMix(aAngle){
    const O=P(230,165),R=108;
    const A=polar(O.x,O.y,R,270);
    const B=polar(O.x,O.y,R,90);
    const C=polar(O.x,O.y,R,24);   // upper-right point on the semicircle
    const D=polar(O.x,O.y,R,335);  // lower-left point on the other semicircle
    return svg(`
      <circle class="circle" cx="${O.x}" cy="${O.y}" r="${R}"/>
      <line class="line" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}"/>
      <line class="line" x1="${B.x}" y1="${B.y}" x2="${C.x}" y2="${C.y}"/>
      <line class="line" x1="${A.x}" y1="${A.y}" x2="${D.x}" y2="${D.y}"/>
      <line class="line" x1="${B.x}" y1="${B.y}" x2="${D.x}" y2="${D.y}"/>
      ${angleArc(A,B,C,16,`${aAngle}°`,34,2,1)}
      ${angleArc(B,A,C,16,"𝑦",31,2,0)}
      ${angleArc(D,A,B,16,"𝑥",30,-2,-1)}
      ${oLabel(O,"lowerRight")}
    `);
  }


  // ----- Stage 4: scale-consistent multi-step figures -----

  // Small central angle theta is given; P is on the minor arc AB,
  // so angle APB intercepts the major arc.
  function challengeLongFromCenter(theta){
    const O=P(230,150), R=108;
    const A=polar(O.x,O.y,R,180-theta/2);
    const B=polar(O.x,O.y,R,180+theta/2);
    const V=polar(O.x,O.y,R,180);
    return svg(`
      <circle class="circle" cx="${O.x}" cy="${O.y}" r="${R}"/>
      <line class="line" x1="${O.x}" y1="${O.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${O.x}" y1="${O.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${V.x}" y1="${V.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${V.x}" y1="${V.y}" x2="${B.x}" y2="${B.y}"/>
      ${angleArc(O,A,B,21,`${theta}°`,45,0,-4)}
      ${angleArc(V,A,B,18,"𝑥",35,0,1)}
      ${oLabel(O,"upperRight")}
    `);
  }

  // Long-arc inscribed angle alpha is given; x is the minor central angle.
  function challengeMinorCenterFromLong(alpha){
    const theta=360-2*alpha;
    const O=P(230,150), R=108;
    const A=polar(O.x,O.y,R,180-theta/2);
    const B=polar(O.x,O.y,R,180+theta/2);
    const V=polar(O.x,O.y,R,180);
    return svg(`
      <circle class="circle" cx="${O.x}" cy="${O.y}" r="${R}"/>
      <line class="line" x1="${O.x}" y1="${O.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${O.x}" y1="${O.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${V.x}" y1="${V.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${V.x}" y1="${V.y}" x2="${B.x}" y2="${B.y}"/>
      ${angleArc(V,A,B,18,`${alpha}°`,37,0,1)}
      ${angleArc(O,A,B,21,"𝑥",42,0,-4)}
      ${oLabel(O,"upperRight")}
    `);
  }

  // Top vertex sees the minor arc, bottom vertex sees the major arc.
  function challengeShortLongPair(beta){
    const theta=2*beta;
    const O=P(230,150), R=108;
    const A=polar(O.x,O.y,R,180-theta/2);
    const B=polar(O.x,O.y,R,180+theta/2);
    const C=polar(O.x,O.y,R,0);
    const D=polar(O.x,O.y,R,180);
    return svg(`
      <circle class="circle" cx="${O.x}" cy="${O.y}" r="${R}"/>
      <line class="line" x1="${C.x}" y1="${C.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${C.x}" y1="${C.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${D.x}" y1="${D.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${D.x}" y1="${D.y}" x2="${B.x}" y2="${B.y}"/>
      ${angleArc(C,A,B,17,`${beta}°`,34,0,-1)}
      ${angleArc(D,A,B,18,"𝑥",35,0,1)}
    `);
  }

  // Given inscribed alpha, find the base angle of isosceles triangle AOB.
  function baseAngleFromInscribed(alpha){
    const theta=2*alpha;
    const O=P(230,160), R=108;
    const A=polar(O.x,O.y,R,180-theta/2);
    const B=polar(O.x,O.y,R,180+theta/2);
    const C=polar(O.x,O.y,R,0);
    return svg(`
      <circle class="circle" cx="${O.x}" cy="${O.y}" r="${R}"/>
      <line class="line" x1="${C.x}" y1="${C.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${C.x}" y1="${C.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${O.x}" y1="${O.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${O.x}" y1="${O.y}" x2="${B.x}" y2="${B.y}"/>
      ${angleArc(C,A,B,17,`${alpha}°`,34,0,-1)}
      ${angleArc(A,O,B,16,"𝑥",31,2,-1)}
      ${oLabel(O,"upperRight")}
    `);
  }

  // Given a long-arc inscribed angle, find a base angle of AOB.
  function baseAngleFromLongInscribed(alpha){
    const theta=360-2*alpha;
    const O=P(230,165), R=108;

    // 긴 호를 보는 원주각이 위쪽에서 넓고 깔끔하게 보이도록 배치
    const A=polar(O.x,O.y,R,360-theta/2);
    const B=polar(O.x,O.y,R,theta/2);
    const V=polar(O.x,O.y,R,0);

    return svg(`
      <circle class="circle" cx="${O.x}" cy="${O.y}" r="${R}"/>

      <line class="line" x1="${V.x}" y1="${V.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${V.x}" y1="${V.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>

      <line class="line" x1="${O.x}" y1="${O.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${O.x}" y1="${O.y}" x2="${B.x}" y2="${B.y}"/>

      ${angleArc(V,A,B,18,`${alpha}°`,38,0,3)}
      ${angleArc(A,O,B,16,"𝑥",31,2,1)}
      ${oLabel(O,"lowerRight")}
    `);
  }

  // AB is a diameter. ∠BAC=g and ∠CDB=g (same arc BC).
  // Since ∠ADB=90°, x=∠ADC=90-g.
  function diameterSameArc(g){
    const O=P(230,155), R=108;
    const A=polar(O.x,O.y,R,270);
    const B=polar(O.x,O.y,R,90);
    const C=polar(O.x,O.y,R,90-2*g);
    const D=polar(O.x,O.y,R,205);
    return svg(`
      <circle class="circle" cx="${O.x}" cy="${O.y}" r="${R}"/>
      <line class="line" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}"/>
      <line class="line" x1="${D.x}" y1="${D.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${D.x}" y1="${D.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${D.x}" y1="${D.y}" x2="${C.x}" y2="${C.y}"/>
      ${angleArc(A,B,C,16,`${g}°`,34,2,0)}
      ${angleArc(D,A,C,16,"𝑥",31,-2,0)}
      ${oLabel(O,"lowerRight")}
    `);
  }

  // Given the small central angle theta. The bottom vertex P is on the minor arc,
  // so ∠APB is a long-arc inscribed angle. One other triangle angle is given.
  function longArcTriangle(theta,aGiven){
    const O=P(230,145), R=108;
    const A=polar(O.x,O.y,R,180-theta/2);
    const B=polar(O.x,O.y,R,180+theta/2);
    const V=polar(O.x,O.y,R,180);
    return svg(`
      <circle class="circle" cx="${O.x}" cy="${O.y}" r="${R}"/>
      <line class="line" x1="${O.x}" y1="${O.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${O.x}" y1="${O.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${V.x}" y1="${V.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${V.x}" y1="${V.y}" x2="${B.x}" y2="${B.y}"/>
      ${angleArc(O,A,B,20,`${theta}°`,43,0,-4)}
      ${angleArc(A,B,V,15,`${aGiven}°`,31,2,0)}
      ${angleArc(B,V,A,15,"𝑥",30,-2,0)}
      ${oLabel(O,"upperRight")}
    `);
  }

  // Given ∠BAC=g. y is central ∠BOC=2g.
  // D lies on the other semicircle: ∠ADB=90° and ∠CDB=g, so x=90-g.
  function masterXY(g){
    const O=P(230,155), R=108;
    const A=polar(O.x,O.y,R,270);
    const B=polar(O.x,O.y,R,90);
    const C=polar(O.x,O.y,R,90-2*g);
    const D=polar(O.x,O.y,R,205);
    return svg(`
      <circle class="circle" cx="${O.x}" cy="${O.y}" r="${R}"/>
      <line class="line" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}"/>
      <line class="line" x1="${D.x}" y1="${D.y}" x2="${A.x}" y2="${A.y}"/>
      <line class="line" x1="${D.x}" y1="${D.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${D.x}" y1="${D.y}" x2="${C.x}" y2="${C.y}"/>
      <line class="line" x1="${O.x}" y1="${O.y}" x2="${B.x}" y2="${B.y}"/>
      <line class="line" x1="${O.x}" y1="${O.y}" x2="${C.x}" y2="${C.y}"/>
      ${angleArc(A,B,C,16,`${g}°`,34,2,0)}
      ${angleArc(D,A,C,16,"𝑥",31,-2,0)}
      ${angleArc(O,B,C,19,"𝑦",37,0,-2)}
      ${oLabel(O,"lowerLeft")}
    `);
  }

  function resetProblemCard(){
    $("#problemCard").innerHTML = `
      <div class="head">
        <h2 id="problemTitle">문제</h2>
        <p id="problemSub">원주각 성질</p>
      </div>
      <div class="progress"><div id="progressBar" style="width:0%"></div></div>
      <div class="visual" id="visualBox"></div>
      <p class="prompt" id="promptText"></p>
      <div class="answer" id="answerBox"></div>
      <div class="actions">
        <div><button class="btn" id="hintBtn">힌트</button></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn hidden" id="revealBtn">정답 보기</button>
          <button class="btn primary" id="checkBtn">확인</button>
          <button class="btn primary hidden" id="nextBtn">다음</button>
        </div>
      </div>
      <div id="feedbackBox" class="hidden"></div>`;
    bindProblemButtons();
  }

  function bindProblemButtons(){
    $("#hintBtn").addEventListener("click", showHint);
    $("#revealBtn").addEventListener("click", revealAnswer);
    $("#checkBtn").addEventListener("click", checkAnswer);
    $("#nextBtn").addEventListener("click", nextQuestion);
  }

  function renderQuestion(){
    answered = false;
    wrongAttempts = 0;
    const q = questions[qIndex];
    $("#stagePill").textContent = STAGES[currentStage].title;
    $("#scorePill").textContent = `점수 ${stageScore}`;
    $("#xpPill").textContent = `XP +${stageXP}`;
    $("#countPill").textContent = `${qIndex+1} / ${questions.length}`;
    $("#problemTitle").textContent = q.title;
    $("#problemSub").textContent = q.sub;
    $("#progressBar").style.width = `${(qIndex/questions.length)*100}%`;
    const visualBox = $("#visualBox");
    const headBox = $("#problemTitle").closest(".head");
    const promptBox = $("#promptText");
    if(q.type==="fill"){
      headBox.classList.remove("hidden");
      promptBox.classList.remove("hidden");
      visualBox.classList.add("hidden");
      visualBox.innerHTML = "";
      promptBox.textContent = q.prompt;
    }else{
      headBox.classList.add("hidden");
      promptBox.classList.add("hidden");
      visualBox.classList.remove("hidden");
      visualBox.innerHTML = q.visual;
      promptBox.textContent = "";
    }
    $("#feedbackBox").className = "hidden";
    $("#feedbackBox").innerHTML = "";
    $("#checkBtn").classList.remove("hidden");
    $("#nextBtn").classList.add("hidden");
    $("#revealBtn").classList.add("hidden");

    const answerBox = $("#answerBox");
    if(q.type==="fill"){
      let html = q.text;
      q.options.forEach((opts,i) => {
        const selectHTML = `<select data-blank="${i}"><option value="">선택</option>${opts.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("")}</select>`;
        html = html.replace(`[[${i}]]`, selectHTML);
      });
      answerBox.innerHTML = `<div class="sheet">${html}</div>`;
    }else{
      const target = q.prompt.includes("𝑥 + 𝑦") ? `<div class="degree">𝑥 + 𝑦 =</div>` : "";
      answerBox.innerHTML = `<div class="input-row">${target}<input id="numInput" inputmode="numeric" autocomplete="off" aria-label="답"><div class="degree">°</div></div>`;
      setTimeout(() => $("#numInput")?.focus(), 40);
      $("#numInput")?.addEventListener("keydown", e => { if(e.key==="Enter") checkAnswer(); });
    }
  }

  function showFeedback(type, html){
    const box = $("#feedbackBox");
    box.className = `feedback ${type}`;
    box.innerHTML = html;
  }

  function showHint(){
    const q = questions[qIndex];
    showFeedback("hint", `힌트: ${q.hint}`);
  }

  function checkAnswer(){
    if(answered) return;
    const q = questions[qIndex];
    let correct = false;

    if(q.type==="fill"){
      const selects = $$("#answerBox select");
      const values = selects.map(s => s.value);
      if(values.some(v => !v)){
        showFeedback("hint", "칸을 채우세요.");
        return;
      }
      correct = values.every((v,i) => v === q.answers[i]);
    }else{
      const input = $("#numInput");
      const v = (input?.value || "").trim().replace("°","");
      if(!v || isNaN(Number(v))){
        showFeedback("hint", "숫자를 입력하세요.");
        return;
      }
      correct = Number(v) === Number(q.answer);
    }

    state.attempted += 1;

    if(!correct){
      wrongAttempts += 1;

      if(q.type==="number"){
        const input = $("#numInput");
        if(input){
          input.focus();
          input.select();
        }
      }

      if(wrongAttempts === 1){
        showFeedback("bad", "다시 풀어보세요.");
      }else if(wrongAttempts === 2){
        showFeedback("bad", "다시 풀어보세요.");
      }else{
        showFeedback("bad", "다시 풀어보세요.");
        $("#revealBtn").classList.remove("hidden");
      }

      saveState();
      return;
    }

    answered = true;
    state.correct += 1;
    stageScore += 10;
    const xpGain = currentStage==="stage1" ? 6 : currentStage==="stage2" ? 8 : currentStage==="stage3" ? 12 : 16;
    stageXP += xpGain;

    showFeedback("good", `정답 · +10점 · +${xpGain}XP`);

    $("#scorePill").textContent = `점수 ${stageScore}`;
    $("#xpPill").textContent = `XP +${stageXP}`;
    $("#checkBtn").classList.add("hidden");
    $("#revealBtn").classList.add("hidden");
    $("#nextBtn").classList.remove("hidden");
    saveState();
  }

  function revealAnswer(){
    if(answered || wrongAttempts < 3) return;
    const q = questions[qIndex];

    answered = true;

    if(q.type==="fill"){
      showFeedback("hint", `정답: <b>${q.answers.join(", ")}</b>`);
    }else{
      showFeedback("hint", `정답: <b>${q.answer}°</b>`);
    }

    $("#checkBtn").classList.add("hidden");
    $("#revealBtn").classList.add("hidden");
    $("#nextBtn").classList.remove("hidden");
    saveState();
  }

  function nextQuestion(){
    if(!answered) return;
    qIndex += 1;
    if(qIndex >= questions.length){
      finishStage();
      return;
    }
    renderQuestion();
  }

  function finishStage(){
    const meta = STAGES[currentStage];
    const elapsed = stopTimer();
    state.score += stageScore;
    state.xp += stageXP;
    state.stages[currentStage].completed = true;
    state.stages[currentStage].bestScore = Math.max(state.stages[currentStage].bestScore, stageScore);
    const oldBestTime = state.stages[currentStage].bestTime;
    if(!oldBestTime || elapsed < oldBestTime) state.stages[currentStage].bestTime = elapsed;
    if(currentStage==="stage1") state.stages.stage2.unlocked = true;
    if(currentStage==="stage2") state.stages.stage3.unlocked = true;
    if(currentStage==="stage3") state.stages.stage4.unlocked = true;
    saveState();

    $("#problemCard").innerHTML = `
      <div class="complete">
        <h2>완료</h2>
        <div class="rewards">
          <div class="reward"><span>점수</span><b>${stageScore}</b></div>
          <div class="reward"><span>시간</span><b>${formatTime(elapsed)}</b></div>
          <div class="reward"><span>최고 기록</span><b>${formatTime(state.stages[currentStage].bestTime)}</b></div>
          <div class="reward"><span>XP</span><b>+${stageXP}</b></div>
        </div>
        <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap">
          <button class="btn primary" id="finishHomeBtn">홈으로</button>
          <button class="btn" id="retryStageBtn">이 단계 다시 풀기</button>
        </div>
      </div>`;
    $("#finishHomeBtn").addEventListener("click", () => { resetProblemCard(); renderHome(); });
    $("#retryStageBtn").addEventListener("click", () => { resetProblemCard(); startStage(currentStage); });
  }

  $("#saveNameBtn").addEventListener("click", () => {
    state.name = $("#nameInput").value.trim();
    saveState();
    renderHome();
  });

  $("#backBtn").addEventListener("click", () => {
    if(confirm("현재 단계를 나갈까요?")){
      resetProblemCard();
      renderHome();
    }
  });

  resetProblemCard();
  renderHome();
})();
</script>
</body>
</html>
